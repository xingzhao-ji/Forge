name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Runtime tests and CLI smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # The runtime and test suite use only the Python standard library.
      # Fixtures use temporary SQLite databases; no provider credentials are needed.
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic CLI workflow
        run: python -m forge
