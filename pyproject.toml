[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-workflow-runtime"
version = "0.1.0"
description = "A local SQLite-backed workflow runtime with bounded workers and persisted events"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "Jared Ji" }]

[project.urls]
Repository = "https://github.com/xingzhao-ji/Forge"

[project.scripts]
forge-demo = "forge.__main__:main"

[tool.setuptools.packages.find]
include = ["forge*"]
